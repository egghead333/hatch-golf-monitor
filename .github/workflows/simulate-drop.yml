name: Simulate Hatch Golf Drop

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send simulated release
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          python -c "import monitor; monitor.notify({'id': 'test-only-001', 'title': 'TEST ONLY - Hatch Fairway Headcover', 'handle': 'hatch-test-only', 'product_type': 'Fairway Headcover', 'variants': [{'price': '150.00', 'available': True}]})"
