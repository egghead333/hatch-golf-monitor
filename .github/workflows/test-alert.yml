
name: Test Hatch Golf Alert

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Pushover emergency test
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          curl --fail-with-body --show-error \
            --request POST \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=HATCH GOLF TEST" \
            --form-string "message=GitHub is now connected to Pushover!" \
            --form-string "priority=2" \
            --form-string "retry=30" \
            --form-string "expire=120" \
            --form-string "sound=siren" \
            https://api.pushover.net/1/messages.json
